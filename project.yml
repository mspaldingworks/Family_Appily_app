name: FamilyAppily
options:
  bundleIdPrefix: com.mspaldingworks
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  FamilyCore:
    path: FamilyCore
  JobSearchCore:
    path: JobSearchCore

targets:
  FamilyAppily:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Platforms/iOS
      - path: Features/Profiles
      - path: Features/Chores
      - path: Features/JobSearch
    dependencies:
      - package: FamilyCore
      - package: JobSearchCore
    info:
      path: Platforms/iOS/Info.plist
      properties:
        JobSearchAPIToken: $(JOB_SEARCH_API_TOKEN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mspaldingworks.FamilyAppily
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MNR8M8K86K
    entitlements:
      path: Platforms/iOS/FamilyAppily.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.mspaldingworks.FamilyAppily
        com.apple.developer.icloud-services:
          - CloudKit

  FamilyAppilyJobSearch:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Platforms/macOS
      - path: Features/JobSearch
    dependencies:
      - package: JobSearchCore
    info:
      path: Platforms/macOS/Info.plist
      properties:
        JobSearchAPIToken: $(JOB_SEARCH_API_TOKEN)
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mspaldingworks.FamilyAppilyJobSearch
        PRODUCT_NAME: "Job Search"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MNR8M8K86K
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true

schemes:
  FamilyAppily:
    build:
      targets:
        FamilyAppily: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
  FamilyAppilyJobSearch:
    build:
      targets:
        FamilyAppilyJobSearch: all
    run:
      config: Debug
