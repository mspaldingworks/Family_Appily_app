name: FamilyAppily
options:
  bundleIdPrefix: com.mspaldingworks
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  FamilyCore:
    path: FamilyCore

targets:
  FamilyAppily:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Platforms/iOS
      - path: Features/Profiles
      - path: Features/Chores
      - path: Features/Rewards
    dependencies:
      - package: FamilyCore
    info:
      path: Platforms/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mspaldingworks.FamilyAppily
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MNR8M8K86K
    entitlements:
      path: Platforms/iOS/FamilyAppily.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.mspaldingworks.FamilyAppily
        com.apple.developer.icloud-services:
          - CloudKit

  FamilyAppilyMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Platforms/macOS
      - path: Features/Profiles
      - path: Features/Chores
      - path: Features/Rewards
    dependencies:
      - package: FamilyCore
    info:
      path: Platforms/macOS/Info.plist
      properties:
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mspaldingworks.FamilyAppily
        PRODUCT_NAME: "Family Appily"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MNR8M8K86K
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    # No iCloud entitlement: that requires a provisioning profile, which
    # requires this Mac to be registered in the developer account. Without it
    # FamilyModelContainer falls back to a local store, so the household side
    # works but doesn't sync with the phone. See the note in the README.
    entitlements:
      path: Platforms/macOS/FamilyAppilyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true

schemes:
  FamilyAppily:
    build:
      targets:
        FamilyAppily: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
  FamilyAppilyMac:
    build:
      targets:
        FamilyAppilyMac: all
    run:
      config: Debug
